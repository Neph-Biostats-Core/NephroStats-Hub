    description: Statistical analysis protocol template (Stanford Medicine Box).
  - name: Office hours sign-up
    url: https://app.smartsheet.com/b/publish?EQBCT=a6704b5781cb4c9a86878cdfbbb672d4
    description: Upcoming office hours; sign up to receive the Zoom link.
  - name: KCR conference schedule
